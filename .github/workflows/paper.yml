name: Paper trade (hourly)

# Runs the CRISP paper portfolio on Alpaca (paper account — synthetic money).
# Each run refreshes the website snapshot from Alpaca's live equity/portfolio
# history (so the curve updates intraday) and rebalances when the 21-trading-day
# cadence is due. Commits the updated ledger + web snapshot.
on:
  schedule:
    # Hourly during US market hours (≈9am–5pm ET). Cron is UTC and can't read
    # holidays; the engine is idempotent and only trades when a new daily close
    # makes the cadence due.
    - cron: "0 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Advance paper portfolio
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python scripts/paper_step.py --broker alpaca --data-source yfinance

      - name: Commit ledger if changed
        run: |
          git config user.name "William Brodhead"
          git config user.email "brodheadw@gmail.com"
          if [ -n "$(git status --porcelain paper/)" ]; then
            git add paper/
            git commit -m "Paper trade: snapshot $(date -u +'%Y-%m-%d %H:%M')Z"
            git push
          else
            echo "No change; skipping commit."
          fi
